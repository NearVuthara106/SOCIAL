<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social</title>
    <style>
        :root {
            /* Fixed the link: added upload.wikimedia.org */
            --bg-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/New_York_City_at_night_HDR.jpg/1280px-New_York_City_at_night_HDR.jpg');
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.12); 
            --text-main: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            /* Optimized Background: Changed 'fixed' to 'scroll' for mobile performance */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: scroll; 
            background-repeat: no-repeat;
            
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow);
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .link-item {
            background: var(--card-bg);
            /* Optimized: Reduced blur slightly and added will-change to prevent lag */
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            will-change: transform;
            display: flex;
            align-items: center;
            padding: 18px 25px;
            margin-bottom: 18px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .link-item:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.2);
        }

        .icon {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            object-fit: contain;
        }

        .platform-name {
            flex-grow: 1;
        }

        .id-text {
            font-size: 0.8rem;
            opacity: 0.8;
            font-weight: normal;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
        }

        .copyright {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            .container { max-width: 100%; }
            body { padding-top: 30px; }
            /* Turn off blur for very old phones to stop lag completely */
            .link-item { backdrop-filter: none; background: rgba(40, 40, 40, 0.8); }
        }
    </style>
</head>
<body>

       <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/1024px-Cat03.jpg" alt="Profile">

            <div class="platform-name">
                Mobile Legends <br>

        <a href="https://www.instagram.com/near.vuthara106?igsh=eTZnZ3o2NGtrNDU1" class="link-item">

        <a href="https://m.me/nearvuthara106" class="link-item">
